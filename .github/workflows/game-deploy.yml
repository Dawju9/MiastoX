name: Build & Deploy Game

on:
  push:
    branches: ["main"]
    paths:
      - "src/**"
      - "Packages/**"
      - "MiastoX.rbxl"
      - "default.project.json"
      - "build.project.json"
      - "wally.toml"
      - "aftman.toml"
      - ".darklua.json"
      - ".lune/**"
  workflow_dispatch:
    inputs:
      version_type:
        description: "Published — publikuje od razu, Saved — zapisuje wersję bez publikacji"
        required: true
        default: "Published"
        type: choice
        options:
          - Published
          - Saved

permissions:
  contents: read

concurrency:
  group: roblox-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  RBXL_FILE: MiastoX.rbxl
  UNIVERSE_ID: ${{ vars.ROBLOX_UNIVERSE_ID || secrets.ROBLOX_UNIVERSE_ID }}
  PLACE_ID: ${{ vars.PLACE_ID || secrets.PLACE_ID }}
  VERSION_TYPE: ${{ inputs.version_type || 'Published' }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: roblox-production
      url: https://www.roblox.com/games/${{ env.PLACE_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Aftman tools
        uses: ok-nick/setup-aftman@v0.4.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        shell: bash
        run: |
          aftman install
          wally install

      - name: Build place file
        shell: bash
        run: rojo build default.project.json -o "$RBXL_FILE"

      - name: Verify place file
        shell: bash
        run: |
          test -s "$RBXL_FILE" || { echo "::error::Place file is missing or empty"; exit 1; }
          echo "Built $RBXL_FILE ($(stat -c%s "$RBXL_FILE") bytes)"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: game-build
          path: ${{ env.RBXL_FILE }}
          retention-days: 7

      - name: Publish to Roblox place
        id: publish
        shell: bash
        env:
          ROBLOX_API_KEY: ${{ secrets.API_KEY || secrets.ROBLOX_API_KEY }}
        run: |
          set -euo pipefail
          for name in ROBLOX_API_KEY UNIVERSE_ID PLACE_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing $name — set it in repository secrets/variables"
              exit 1
            fi
          done
          case "$VERSION_TYPE" in
            Saved|Published) ;;
            *) echo "::error::VERSION_TYPE must be Saved or Published"; exit 1 ;;
          esac

          response=$(curl -sS -X POST \
            -H "x-api-key: $ROBLOX_API_KEY" \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@$RBXL_FILE" \
            -w $'\n%{http_code}' \
            "https://apis.roblox.com/universes/v1/$UNIVERSE_ID/places/$PLACE_ID/versions?versionType=$VERSION_TYPE")
          code="${response##*$'\n'}"
          body="${response%$'\n'*}"
          if [ "$code" != "200" ]; then
            echo "::error::Publish failed ($code): $body"
            exit 1
          fi
          echo "version=$body" >> "$GITHUB_OUTPUT"
          echo "Published version $body to place $PLACE_ID"

      - name: Deployment summary
        shell: bash
        env:
          VERSION: ${{ steps.publish.outputs.version }}
        run: |
          {
            echo "## Deployment report"
            echo "- **Place ID:** ${{ env.PLACE_ID }}"
            echo "- **Universe ID:** ${{ env.UNIVERSE_ID }}"
            echo "- **Version type:** ${{ env.VERSION_TYPE }}"
            echo "- **Published version:** ${VERSION:-unknown}"
            echo "- **Commit:** ${{ github.sha }}"
            echo "- **Game:** https://www.roblox.com/games/${{ env.PLACE_ID }}"
          } >> "$GITHUB_STEP_SUMMARY"
