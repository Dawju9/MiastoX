---
<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MiastoX {{ page.title }}</title>
  <meta name="description" content="{{ page.desc }}">
  <meta property="og:title" content="MiastoX {{ page.title }}">
  <meta property="og:description" content="{{ page.desc }}">
  <meta property="og:url" content="{{ site.url }}{{ site.baseurl }}{{ page.url }}">
  <meta property="og:image" content="{{ site.url }}{{ site.baseurl }}/gh-assets/project_logo.svg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="{{ site.baseurl }}/gh-assets/project_logo.svg">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ site.baseurl }}/tailwind.css">
</head>
<body class="min-h-screen bg-[#0a0a0a] text-[#e0e0e0] font-sans">
  <nav class="sticky top-0 z-50 border-b border-[#00f5ff33] bg-[#16161e]/95 shadow-[0_4px_30px_rgba(0,245,255,0.12)] backdrop-blur-lg">
    <div class="container mx-auto flex items-center justify-between gap-4 p-4">
      <a href="{{ site.baseurl }}/" class="flex items-center gap-3 text-lg font-bold text-[#00f5ff] sm:text-xl">
        <img src="{{ site.baseurl }}/gh-assets/project_logo.svg" alt="" class="h-7 w-7 sm:h-8 sm:w-8">
        MiastoX
      </a>
      <div class="hidden items-center gap-4 text-sm md:flex">
        <a href="{{ site.baseurl }}/map.html" class="text-[#aaaaaa] transition duration-300 hover:text-[#00f5ff]">Mapa</a>
        <a href="{{ site.baseurl }}/jobs.html" class="text-[#aaaaaa] transition duration-300 hover:text-[#00f5ff]">Dołącz</a>
        <a href="{{ site.baseurl }}/projects.html" class="text-[#aaaaaa] transition duration-300 hover:text-[#00f5ff]">Projekty</a>
        <a href="{{ site.baseurl }}/changelog.html" class="text-[#aaaaaa] transition duration-300 hover:text-[#00f5ff]">Changelog</a>
        <a href="{{ site.baseurl }}/hierarchy.html" class="text-[#aaaaaa] transition duration-300 hover:text-[#00f5ff]">Gracze</a>
        <a href="https://www.roblox.com/games/11633610328/MiastoX-Updated-24th" target="_blank" rel="noopener noreferrer" class="rounded-full bg-[#00f5ff] px-4 py-2 font-bold text-black transition duration-300 hover:scale-105">GRAJ</a>
      </div>
      <div class="flex items-center gap-2 md:hidden">
        <a href="https://www.roblox.com/games/11633610328/MiastoX-Updated-24th" target="_blank" rel="noopener noreferrer" class="rounded-full bg-[#00f5ff] px-3 py-2 text-xs font-bold text-black">GRAJ</a>
        <input type="checkbox" id="menu-toggle" class="sr-only">
        <label for="menu-toggle" class="flex h-10 w-10 flex-col items-center justify-center rounded-lg border border-[#00f5ff33] bg-[#16161e] text-[#00f5ff]" aria-label="Otwórz menu">
          <span class="block h-0.5 w-5 bg-current"></span>
          <span class="mt-1 block h-0.5 w-5 bg-current"></span>
          <span class="mt-1 block h-0.5 w-5 bg-current"></span>
        </label>
      </div>
    </div>
    <div id="mobile-menu" class="hidden border-t border-[#00f5ff22] bg-[#16161e] px-4 py-3 md:hidden">
      <div class="flex flex-col gap-1 text-sm">
        <a href="{{ site.baseurl }}/map.html" class="rounded px-3 py-2 text-[#aaaaaa] hover:bg-[#00f5ff11] hover:text-[#00f5ff]">Mapa</a>
        <a href="{{ site.baseurl }}/jobs.html" class="rounded px-3 py-2 text-[#aaaaaa] hover:bg-[#00f5ff11] hover:text-[#00f5ff]">Dołącz</a>
        <a href="{{ site.baseurl }}/projects.html" class="rounded px-3 py-2 text-[#aaaaaa] hover:bg-[#00f5ff11] hover:text-[#00f5ff]">Projekty</a>
        <a href="{{ site.baseurl }}/changelog.html" class="rounded px-3 py-2 text-[#aaaaaa] hover:bg-[#00f5ff11] hover:text-[#00f5ff]">Changelog</a>
        <a href="{{ site.baseurl }}/hierarchy.html" class="rounded px-3 py-2 text-[#aaaaaa] hover:bg-[#00f5ff11] hover:text-[#00f5ff]">Gracze</a>
      </div>
    </div>
  </nav>

  <main class="mx-auto w-full max-w-7xl px-4 py-6 sm:py-8">
    {{ content }}
  </main>

  <footer class="border-t border-[#00f5ff22] bg-[#16161e] p-6 text-center text-xs text-[#aaaaaa] sm:p-8 sm:text-sm">
    <p>© 2024 MiastoX. Built with ❤️ using NeoCity X Design System.</p>
    <div class="mt-3 flex flex-wrap justify-center gap-4">
      <a href="https://discord.gg/miastox" class="hover:text-[#00f5ff]">Discord</a>
      <a href="https://www.roblox.com/groups/14766364/MiastoX-Software-LLC" class="hover:text-[#00f5ff]">Roblox</a>
      <a href="{{ site.baseurl }}/changelog.html" class="hover:text-[#00f5ff]">Changelog</a>
    </div>
  </footer>
  <script src="{{ site.baseurl }}/script.js"></script>
</body>
</html>
